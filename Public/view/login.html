<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ATS Express</title>
    <link rel="stylesheet" href="../css/app.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-layout">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                ATS Express
            </div>
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Log in to your account to continue</p>
        </div>

        <form action="index.html" method="GET">
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="accountant@company.com" required>
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="form-options">
                <label class="checkbox-group">
                    <input type="checkbox" id="remember">
                    <span>Remember me</span>
                </label>
                <a href="recover_password.html" class="auth-link">Forgot password?</a>
            </div>

            <button type="submit" class="btn-primary btn-block">Log In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="register.html" class="auth-link">Sign up</a>
        </div>
    </div>
</body>
</html>
